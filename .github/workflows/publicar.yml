# Publica en npm al crear una etiqueta `v*`.
#
# NO hay ningún token. Usa "trusted publishing": GitHub le demuestra a npm quién
# es en el momento de publicar (OIDC), y npm comprueba que la petición viene de
# ESTE repositorio y de ESTE fichero de workflow. No hay secreto guardado en
# ninguna parte, así que no hay nada que robar ni que caduque.
#
# Se activa una sola vez en npmjs.com → el paquete → Settings → Trusted
# publisher. Ver ~/Documentos/lanzamiento-botsees.md.
#
# A partir de ahí, publicar es:  git tag v0.2.0 && git push --tags
name: Publicar en npm

on:
  push:
    tags: ["v*"]

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # SIN esto no hay OIDC y la publicación falla
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # 🔴 El npm que trae Node NO sabe de trusted publishing: hace falta 11.5.1
      # o superior. Node 22 viene con el 10, así que sin esta línea la
      # publicación falla pidiendo un token que no existe.
      - run: npm install -g npm@latest

      # Que la etiqueta y la versión del paquete coincidan. Publicar v0.2.0 con
      # un package.json que dice 0.1.0 deja el registro y el repositorio
      # contando cosas distintas, y no hay forma de arreglarlo después.
      - name: La etiqueta coincide con la versión
        run: |
          v=$(node -p "require('./package.json').version")
          t="${GITHUB_REF_NAME#v}"
          [ "$v" = "$t" ] || { echo "package.json dice $v y la etiqueta $t"; exit 1; }

      - run: node bin/botsees.js --help

      # La procedencia firmada (de qué commit y qué workflow salió el paquete)
      # va incluida: con trusted publishing npm la genera sola.
      - run: npm publish --access public
